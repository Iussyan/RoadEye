name: Mobile release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart format lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Upload formatted source and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: RoadEye-source-${{ github.run_number }}
          path: |
            lib
            test
            tool
            pubspec.lock
          retention-days: 14

  ios:
    name: iOS release for AltStore
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Generate native projects if absent
        run: dart run tool/bootstrap.dart
      - name: Build release app without signing credentials
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign --build-number="${{ github.run_number }}"
      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")
          python3 - "$minimum" <<'PY'
          import sys
          version = tuple(map(int, sys.argv[1].split('.')))
          assert version <= (16, 7, 16), f'Build requires iOS {sys.argv[1]}'
          PY
          lipo -archs "$app/Runner" | tr ' ' '\n' | grep -qx arm64
          mkdir -p build/altstore/Payload
          cp -R "$app" build/altstore/Payload/Runner.app
          cd build/altstore
          /usr/bin/zip -qry RoadEye-unsigned.ipa Payload
          /usr/bin/unzip -t RoadEye-unsigned.ipa
          shasum -a 256 RoadEye-unsigned.ipa > RoadEye-unsigned.ipa.sha256
      - name: Upload IPA and build snapshot
        uses: actions/upload-artifact@v4
        with:
          name: RoadEye-iOS-${{ github.run_number }}
          path: |
            build/altstore/RoadEye-unsigned.ipa
            build/altstore/RoadEye-unsigned.ipa.sha256
            pubspec.lock
            .metadata
            ios
            android
            !ios/Pods/**
            !ios/.symlinks/**
            !ios/Flutter/ephemeral/**
            !ios/Flutter/Generated.xcconfig
            !ios/Flutter/flutter_export_environment.sh
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android release APK
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart run tool/bootstrap.dart
      - run: flutter build apk --release --build-number="${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: RoadEye-Android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
